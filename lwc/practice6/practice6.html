<template>

    <lightning-card title="Account Rating Summary">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                <div class="slds-col slds-size_1-of-4">
                    <lightning-card title="Total Accounts">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {totalAccounts}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-4">
                    <lightning-card title="Hot Accounts">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {hotAccounts}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-4">
                    <lightning-card title="Warm Accounts">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {warmAccounts}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-4">
                    <lightning-card title="Cold Accounts">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {coldAccounts}
                        </div>
                    </lightning-card>
                </div>

            </div>

            <lightning-datatable key-field="Id" data={accounts} columns={columns} hide-checkbox-column>
                >
            </lightning-datatable>

        </div>

    </lightning-card>

</template>
