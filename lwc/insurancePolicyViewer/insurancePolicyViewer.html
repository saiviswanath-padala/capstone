<template>

    <lightning-card title="Insurance Policies" icon-name="standard:contract">

        <div class="slds-p-around_medium">

            <lightning-input type="search" label="Search Contact" placeholder="Enter contact name" value={searchKey}
                onchange={handleSearch}>
            </lightning-input>

        </div>

        <template if:true={policies}>

            <lightning-datatable key-field="Id" data={policies} columns={columns} hide-checkbox-column>
            </lightning-datatable>

        </template>

        <template if:true={error}>

            <div class="slds-p-around_medium">
                Error loading insurance policies.
            </div>

        </template>

    </lightning-card>

</template>
