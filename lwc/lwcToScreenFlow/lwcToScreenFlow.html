<template>
    <lightning-card title="LWC to Screen Flow">
        <div class="slds-var-m-around_medium">
            <lightning-input label="First Name" onchange={handleFirstNameChange}></lightning-input>
            <lightning-input label="Last Name" onchange={handleLastNameChange}></lightning-input>

            <div class="slds-var-m-top_medium">
                <lightning-button label="Show Flow" onclick={hanldeClick}></lightning-button>
            </div>
            <template lwc:if={showFlow}>
                <div class="slds-var-top_medium">
                    <lightning-flow flow-api-name="Screen_Flow_for_LWC" flow-input-variables={flowInputVar}>
                    </lightning-flow>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
