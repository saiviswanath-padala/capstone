<template>

    <lightning-card title="Rental Viewer">

        <div class="slds-p-around_medium">

            <lightning-input type="search" label="Search Contact" value={searchKey} onchange={handleSearch}>
            </lightning-input>

        </div>

        <template if:true={rentals}>

            <lightning-datatable key-field="Id" data={rentals} columns={columns} hide-checkbox-column>
            </lightning-datatable>

        </template>

    </lightning-card>

</template>
