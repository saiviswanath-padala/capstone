<template>
    <lightning-card title="Lightning Edit form">
        <div class="slds-var-m-around_medium">
            <lightning-record-edit-form object-api-name="Contact" onsubmit={handleSubmit}
                onsuccess={handleSuccess} onerror={handleError}>

                <lightning-input-field field-name="FirstName"></lightning-input-field>
                <lightning-input-field field-name="LastName"></lightning-input-field>
                <lightning-input-field field-name="Phone"></lightning-input-field>
                <lightning-input-field field-name="Email"></lightning-input-field>

                <!-- Populate the courrent account value -->

                <lightning-input-field field-name="AccountId"></lightning-input-field>

                <lightning-button type="submit" label="Create Contact Record"
                    class="slds-var-m-top_medium"></lightning-button>
            </lightning-record-edit-form>


        </div>
    </lightning-card>
</template>
