<template>

    <lightning-card title="Opportunity Profit Summary">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                <div class="slds-col slds-size_1-of-4">
                    <lightning-card title="Total Amount">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {totalAmount}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-4">
                    <lightning-card title="Total Profit (25%)">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {totalProfit}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-4">
                    <lightning-card title="Tax on Profit (10%)">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {taxOnProfit}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-4">
                    <lightning-card title="Net Profit">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {netProfit}
                        </div>
                    </lightning-card>
                </div>

            </div>

            <lightning-datatable key-field="Id" data={opportunities} columns={columns} hide-checkbox-column>
                >
            </lightning-datatable>

        </div>

    </lightning-card>

</template>
