<template>

    <lightning-card title="Account Revenue Summary">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Total Annual Revenue">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {totalRevenue}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="GST (18%)">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {gstAmount}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Revenue Including GST">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {revenueWithGST}
                        </div>
                    </lightning-card>
                </div>

            </div>

            <lightning-datatable key-field="Id" data={accounts} columns={columns} hide-checkbox-column>
            </lightning-datatable>

        </div>

    </lightning-card>

</template>
