<template>

    <lightning-card title="Opportunity Summary">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                <div class="slds-col slds-size_1-of-2">
                    <lightning-card title="Total Opportunities">
                        <div class="slds-p-around_medium slds-text-heading_large">
                            {totalOpportunities}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-2">
                    <lightning-card title="Total Amount">
                        <div class="slds-p-around_medium slds-text-heading_large">
                            {totalAmount}
                        </div>
                    </lightning-card>
                </div>

            </div>

            <lightning-datatable key-field="Id" data={opportunities} columns={columns} hide-checkbox-column>
            </lightning-datatable>

        </div>

    </lightning-card>

</template>
