<template>

    <lightning-card title="Lead Value Summary">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Total Lead Value">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {totalLeadValue}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Bonus (8%)">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {bonusAmount}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Final Value After Bonus">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {finalValue}
                        </div>
                    </lightning-card>
                </div>

            </div>

            <lightning-datatable key-field="Id" data={leads} columns={columns} hide-checkbox-column>
            </lightning-datatable>

        </div>

    </lightning-card>

</template>
