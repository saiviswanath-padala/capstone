<template>

    <lightning-card title="Opportunity Discount Summary">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Total Opportunity Amount">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {totalAmount}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="10% Discount">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {discountAmount}
                        </div>
                    </lightning-card>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Final Amount">
                        <div class="slds-p-around_medium slds-text-heading_medium">
                            {finalAmount}
                        </div>
                    </lightning-card>
                </div>

            </div>

            <lightning-datatable key-field="Id" data={opportunities} columns={columns} hide-checkbox-column>
            </lightning-datatable>

        </div>

    </lightning-card>

</template>
