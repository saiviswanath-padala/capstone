<template>

    <lightning-card title="Working Cases">

        <div class="slds-p-around_medium">

            <lightning-button label="Show Working Cases" variant="brand" onclick={showWorkingCases}>
            </lightning-button>

            <template lwc:if={cases.length}>

                <div class="slds-m-top_medium">

                    <lightning-datatable key-field="Id" data={cases} columns={columns} hide-checkbox-column>
                    </lightning-datatable>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
